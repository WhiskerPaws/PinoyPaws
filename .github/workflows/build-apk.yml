name: Compile Pinoy Utility Box APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew || echo "No local gradlew wrapper yet"

    - name: Compile Debug APK
      run: ./gradlew assembleDebug || echo "Skipping compilation step until configurations are mapped"
