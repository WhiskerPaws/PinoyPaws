name: Compile Pinoy Utility Box APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Automatically configures the Gradle build tool without needing manual wrapper commands
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.1.1'

    - name: Compile Production Debug APK
      run: gradle assembleDebug

    - name: Upload Finished APK Artifact File
      uses: actions/upload-artifact@v4
      with:
        name: pinoy-utility-box-installer
        path: app/build/outputs/apk/debug/app-debug.apk
