name: Compile Pinoy Utility Box APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Initialize and Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.1.1

    - name: Compile Production Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact File
      uses: actions/upload-artifact@v4
      with:
        name: pinoy-utility-box-installer
        path: app/build/outputs/apk/debug/app-debug.apk
